<style>

  :root{
    --bg:#0d1117;
    --card:#161b22;
    --glass:rgba(255,255,255,.08);
    --accent:#00f5ff;
    --text:#f0f6fc;
  }
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;min-height:100vh}
  header{width:100%;padding:1.2rem 0;text-align:center;font-size:1.6rem;font-weight:800;background:linear-gradient(90deg,#00f5ff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .form-box{display:flex;flex-direction:column;align-items:center;margin:1rem 0}
select{
  width:260px;
  font-size:1.1rem;
  padding:.75rem;
  border:none;
  border-radius:12px;
  background:var(--glass);
  backdrop-filter:blur(8px);
  color:#00aaff;        /* ← 蓝色字体 */
  outline:2px solid var(--accent);
  outline-offset:-2px;
  cursor:pointer;
}
  .spinner{margin:.5rem 0;width:20px;height:20px;border:2px solid var(--accent);border-top:2px solid transparent;border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .grid{display:grid;gap:1rem;padding:0 1rem 2rem;width:100%;max-width:600px}
  .card{display:flex;justify-content:space-between;align-items:center;padding:1rem;border-radius:16px;background:var(--card);box-shadow:0 4px 18px rgba(0,0,0,.35);backdrop-filter:blur(12px)}
  .pair{font-size:1.1rem}
  .rate{font-family:'JetBrains Mono',monospace;font-size:1.2rem;color:var(--accent)}
  @media(max-width:480px){header{font-size:1.3rem}select{width:90%}.rate{font-size:1rem}}
</style>
</head>

<script>
const $ = s => document.querySelector(s);
function card(pair,rate){
  return `<div class="card"><span class="pair">${pair}</span><span class="rate">${rate}</span></div>`;
}
async function loadRates(code){
  const codeUpper = code.toUpperCase();
  $('#spinner').style.display = 'inline-block';
  const urls = [
    `https://api.coinbase.com/v2/prices/${codeUpper}-USD/spot`,
    `https://api.coinbase.com/v2/prices/${codeUpper}-USDT/spot`,
    `https://api.coinbase.com/v2/prices/${codeUpper}-USDC/spot`
  ];
  try{
    const data = await Promise.all(urls.map(u=>fetch(u).then(r=>r.json())));
    $('#grid').innerHTML = data.map((d,i)=>card(`${codeUpper} → ${['USD','USDT','USDC'][i]}`,Number(d.data.amount).toPrecision(5))).join('');
  }catch(err){
    $('#grid').innerHTML='<div class="card"><span>加载失败</span><span>请稍后重试</span></div>';
  }finally{
    $('#spinner').style.display='none';
  }
}
loadRates('cny');
</script>
